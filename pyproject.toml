[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hlh-server"
version = "0.1.0"
description = "FastAPI service for Humanity's Last Hackathon."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "httpx>=0.27.0",
  "huggingface_hub>=1.0.0",
  "python-multipart>=0.0.9",
  "torch>=2.1.0",
]

[project.scripts]
hlh-server = "hlh_server.service:main"

[tool.setuptools]
packages = ["hlh_server"]
