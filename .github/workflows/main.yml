name: Profiling Job
run-name: profile-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      file_content:
        description: "Content of the file to profile"
        required: true
        type: string
      filename:
        description: "Name for the file"
        required: false
        default: "profile_target.py"
        type: string
      request_id:
        description: "Request identifier from service"
        required: true
        type: string

permissions: {}

jobs:
  profile:
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Write file
        env:
          FILE_CONTENT: ${{ inputs.file_content }}
          FILENAME: ${{ inputs.filename }}
        run: python3 -c "import os; open(os.environ['FILENAME'], 'w').write(os.environ['FILE_CONTENT'])"
      - name: Print request id
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: echo "request_id=$REQUEST_ID"
      - name: Install server deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run profiler
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          python3 -c "
          import asyncio, json, os
          from hlh_server.metal_profiler import profile_file

          async def main():
              result = await profile_file(os.environ['FILENAME'])
              print(json.dumps(result, indent=2))

          asyncio.run(main())
          "
